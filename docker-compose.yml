services:
  api:
    container_name: eaves-api
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - eaves-db
  eaves-db:
    env_file:
      - ./server/.env
    image: postgres:17-alpine
    container_name: eaves-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
