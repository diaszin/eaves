services:
  api:
    container_name: eaves-api
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "51212:51212"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=development
      - TSC_WATCHFILE=DynamicPriorityPolling
      - TSC_WATCHDIRECTORY=RecursiveDirectoryUsingDynamicPriorityPolling
    depends_on:
      - eaves-db
    volumes:
      - ./server/src:/app/src
      - /app/node_modules
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  platform:
    container_name: eaves-platform
    build:
      context: ./platform
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./platform/src:/app/src
      - /app/node_modules
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  eaves-db:
    env_file:
      - ./server/.env
    image: postgres:17-alpine
    container_name: eaves-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  postgres_data:
