services:
  api:
    container_name: eaves-api-prod
    build:
      context: ./server
      dockerfile: Dockerfile.prod
      target: production
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      eaves-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  platform:
    container_name: eaves-platform-prod
    build:
      context: ./platform
      dockerfile: Dockerfile
    ports:
      - "${PLATFORM_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  eaves-db:
    container_name: eaves-db-prod
    image: postgres:17-alpine
    env_file:
      - ./server/.env
    restart: unless-stopped
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  postgres_prod_data:
