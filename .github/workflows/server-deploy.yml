name: Deploy Backend API in Azure VM

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-26.04

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          passphrase: ${{ secrets.VM_SSH_PASSPHRASE }}
          script: |
            cd ~/eaves

            git pull origin main

            docker compose -f docker-compose.prod.yml build --no-cache api && docker compose -f docker-compose.prod.yml up -d api
            docker compose -f docker-compose.prod.yml build --no-cache platform && docker compose -f docker-compose.prod.yml up -d platform


            docker image prune -f
