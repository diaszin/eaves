name: Azure Static Web Apps CI/CD

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app-deploy.yml"
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "app/**"
      - ".github/workflows/app-deploy.yml"
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-26.04
    name: Build and Deploy Job
    environment: production
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Export Expo Web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_MICROSOFT_CLIENT_ID: ${{vars.EXPO_PUBLIC_MICROSOFT_CLIENT_ID}}
          EXPO_PUBLIC_MICROSOFT_TENANT_ID: ${{vars.EXPO_PUBLIC_MICROSOFT_TENANT_ID}}
          EXPO_PUBLIC_MICROSOFT_REDIRECT_URL: ${{vars.EXPO_PUBLIC_MICROSOFT_REDIRECT_URL}}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "app/dist"
          skip_app_build: true
